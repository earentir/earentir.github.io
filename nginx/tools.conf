# Same-origin API for tools (browser → earentir.dev → backend).
# API public clients keep using https://api.earentir.dev unchanged.
location /tilecalc/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /dmt/v1/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Old standalone DMT → tools shell
location = /dmt {
    return 301 /tools/dmt;
}

location = /dmt/ {
    return 301 /tools/dmt;
}

# Path-based client router: serve tools/index.html for unknown /tools/* paths
location /tools/ {
    try_files $uri $uri/ /tools/index.html;
}
